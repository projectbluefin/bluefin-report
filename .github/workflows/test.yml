name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    name: Tests Passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      # internal/ui tests load GTK/libadwaita through puregotk, which finds them via pkg-config.
      - name: Install desktop-file-utils and GTK/libadwaita
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream libgtk-4-dev libadwaita-1-dev

      - name: Lint (gofmt, go vet)
        run: make lint

      - name: Unit tests with race detector
        run: make test

      - name: Validate desktop file
        run: make validate-data
